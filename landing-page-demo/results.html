<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRO Demo — Experiment Results</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f7f9fb; color: #1f2933; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  p.sub { color: #52606d; margin-top: 0; }
  table { width: 100%; border-collapse: collapse; margin: 24px 0; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e4e9ee; font-size: 14px; }
  th { color: #52606d; font-weight: 600; }
  .verdict { padding: 16px; border-radius: 8px; font-size: 15px; font-weight: 600; }
  .verdict.sig { background: #e6f6ea; color: #1a7431; }
  .verdict.not-sig { background: #fff4e5; color: #8a5a00; }
  button { margin-top: 24px; font-size: 14px; padding: 8px 16px; border-radius: 6px; border: 1px solid #d6dde3; background: white; cursor: pointer; }
  a { color: #1f6feb; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Experiment results</h1>
    <p class="sub">Pulled from this browser's local experiment log — visit <a href="index.html">index.html</a> a few times (or reset and try again) to generate traffic.</p>

    <table>
      <thead>
        <tr><th>Bucket</th><th>Impressions</th><th>Conversions</th><th>Conv. rate</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>

    <div id="verdict" class="verdict"></div>

    <button id="reset">Reset local experiment data</button>
  </div>

  <script src="experiment.js"></script>
  <script>
    function render() {
      const log = getLog();
      const rate = (b) => (b.impressions ? ((b.conversions / b.impressions) * 100).toFixed(2) + "%" : "—");

      document.getElementById("table-body").innerHTML = `
        <tr><td>Control</td><td>${log.control.impressions}</td><td>${log.control.conversions}</td><td>${rate(log.control)}</td></tr>
        <tr><td>Variant</td><td>${log.variant.impressions}</td><td>${log.variant.conversions}</td><td>${rate(log.variant)}</td></tr>
      `;

      const result = twoProportionZTest(log.control, log.variant, 0.95);
      const verdictEl = document.getElementById("verdict");
      if (log.control.impressions < 5 || log.variant.impressions < 5) {
        verdictEl.className = "verdict not-sig";
        verdictEl.textContent = "Not enough traffic yet — visit index.html a few more times in each bucket.";
      } else if (result.isSignificant) {
        const winner = result.relativeLiftPct > 0 ? "Variant" : "Control";
        verdictEl.className = "verdict sig";
        verdictEl.textContent = `Significant at 95% confidence (z=${result.z.toFixed(2)}, p=${result.pValue.toFixed(4)}) — ship ${winner}, relative lift ${result.relativeLiftPct.toFixed(1)}%.`;
      } else {
        verdictEl.className = "verdict not-sig";
        verdictEl.textContent = `Not statistically significant yet (z=${result.z.toFixed(2)}, p=${result.pValue.toFixed(4)}) — keep collecting data.`;
      }
    }

    document.getElementById("reset").addEventListener("click", () => {
      localStorage.removeItem("cro_demo_log");
      localStorage.removeItem("cro_demo_bucket");
      render();
    });

    render();
  </script>
</body>
</html>
